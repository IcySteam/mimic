name: OpenWrt package build

on:
  push:
  workflow_dispatch:

jobs:
  build-openwrt:
    name: Build ${{ matrix.target }} packages for ${{ matrix.arch }} on ${{ matrix.revision }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
        target:
          - mediatek/filogic
        revision:
          - openwrt-24.10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The SDK container runs as a non-root user (UID 1000). 
      # We must match permissions so it can read/write to our workspace.
      - name: Fix Workspace Permissions
        run: sudo chown -R 1000:1000 ${{ github.workspace }}

      # Natively run the SDK, explicitly passing the TARGET env var
      - name: Build Package Natively
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /builder \
            -e TARGET=${{ matrix.target }} \
            ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.revision }} \
            /bin/bash -c "
              bash setup.sh &&
              ./scripts/feeds update -a &&
              ./scripts/feeds install -a &&
              mkdir -p package/mimic &&
              cp -a /workspace/. package/mimic/ &&
              make defconfig &&
              make package/mimic/compile V=s &&
              mkdir -p /workspace/bin &&
              cp -a bin/* /workspace/bin/
            "

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.revision }}
          path: |
            bin/packages/*/action/*.ipk
            bin/packages/*/action/*.apk
            bin/targets/*/*/packages/kmod-mimic*.ipk
            bin/targets/*/*/packages/kmod-mimic*.apk
